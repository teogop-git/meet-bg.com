<script>
const h=React.createElement;
const NS=window.MeetBGDesignSystem_b3a11a;
function App(){
  const F = NS.Field;
  const grid={display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:18};
  return h('div',null,
    h('div',{className:'lbl'},'Marketing — Light'),
    h('div',{style:grid},

      h(F,{label:'Брой места',type:'number',defaultValue:'3',error:'Максимум 2 места на човек'})),
    h('div',{className:'dk'},
      h('div',{className:'lbl',style:{color:'#4B4B4B'}},'App — Dark'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}},
        h(F,{theme:'dark',label:'First Name',placeholder:'Ivan'}),
        h(F,{theme:'dark',label:'Last Name',placeholder:'Petrov'}),
        h(F,{theme:'dark',label:'City',placeholder:'London'}),
        h(F,{theme:'dark',label:'Phone',placeholder:'+44 7700 900100'}))));
}
ReactDOM.createRoot(document.getElementById('root')).render(App());
