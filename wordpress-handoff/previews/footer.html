<!DOCTYPE html><html lang="bg"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../tokens.css">
<style>
body { margin: 0; background: #111; padding: 36px 32px 24px; }
.top { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px; padding-bottom: 28px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.brand-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.brand-logo svg { width: 26px; height: 26px; }
.brand-name { font-family: var(--font-display); font-size: 17px; color: white; font-weight: 500; }
.brand-desc { font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.7; max-width: 240px; }
.col h4 { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin: 0 0 12px; }
.col a { display: block; font-size: 12px; color: rgba(255,255,255,0.5); text-decoration: none; margin-bottom: 7px; }
.bot { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; }
.copy { font-size: 11px; color: rgba(255,255,255,0.25); }
.legal { display: flex; gap: 18px; }
.legal a { font-size: 11px; color: rgba(255,255,255,0.25); text-decoration: none; }
@media (max-width: 720px) { .top { grid-template-columns: 1fr; gap: 20px; } .bot { flex-direction: column; gap: 10px; } }
</style></head><body>
<div class="top">
  <div>

        <circle cx="51.5" cy="18.5" r="2.6" fill="white"/><circle cx="51.5" cy="45.5" r="2.6" fill="white"/>
        <circle cx="32" cy="58.5" r="2.6" fill="white"/><circle cx="12.5" cy="45.5" r="2.6" fill="white"/>
